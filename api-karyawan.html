<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi REST API - Minggu 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-8 font-sans text-slate-800">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Direktori Karyawan Cabang Global</h1>
                <p class="text-sm text-slate-500">Data diambil langsung dari Server REST API menggunakan Fetch &
                    Async/Await</p>
            </div>
            <button onclick="ambilDataDariServer()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm">
                Muat Ulang Data API
            </button>
        </div>

        <!-- Indikator Loading -->
        <div id="statusLoading" class="text-center py-8 text-blue-600 font-semibold hidden">
            Sedang mengambil data dari server... Mohon tunggu.
        </div>

        <!-- Pesan Error (Jika internet mati / server gagal) -->
        <div id="pesanError" class="bg-red-100 text-red-700 p-4 rounded-lg mb-4 hidden"></div>

        <table class="w-full border-collapse text-sm">
            <thead>
                <tr class="bg-slate-200 text-left uppercase text-slate-700">
                    <th class="p-3 border">ID</th>
                    <th class="p-3 border">Nama Lengkap</th>
                    <th class="p-3 border">Email Resmi</th>
                    <th class="p-3 border">Kota Penempatan</th>
                    <th class="p-3 border">Nama Perusahaan / Divisi</th>
                </tr>
            </thead>
            <tbody id="tabelBody"></tbody>
        </table>
    </div>

    <script>
        // Perhatikan kata kunci 'async' di depan function
        async function ambilDataDariServer() {
            const loading = document.getElementById('statusLoading');
            const errorBox = document.getElementById('pesanError');
            const tbody = document.getElementById('tabelBody');

            // 1. Tampilkan teks loading dan kosongkan tabel sebelum mulai mengambil data
            loading.classList.remove('hidden');
            errorBox.classList.add('hidden');
            tbody.innerHTML = "";

            try {
                // 2. Meminta data ke server API menggunakan fetch() dan await
                const response = await fetch('https://jsonplaceholder.typicode.com/users');

                // Mengecek apakah respon server berhasil (status 200 OK)
                if (!response.ok) {
                    throw new Error("Gagal mengambil data dari server!");
                }

                // 3. Mengubah respon mentah menjadi Array of Objects (JSON)
                const dataServer = await response.json();

                let barisHTML = "";

                // 4. Melakukan perulangan untuk setiap data dari server
                dataServer.forEach((user) => {
                    // TUGAS 1: Susun baris <tr> ke dalam variabel 'barisHTML'
                    // Tampilkan 5 kolom <td> sesuai urutan kepala tabel:
                    // 1. user.id
                    // 2. user.nama -> di API ini propertinya bernama: user.name
                    // 3. user.email
                    // 4. Kota Penempatan -> propertinya berada di dalam objek address: user.address.city
                    // 5. Nama Perusahaan -> propertinya berada di dalam objek company: user.company.name

                    barisHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 border font-mono">EMP-0${user.id}</td>
                            <td class="p-3 border font-mono">${user.name}</td>
                            <td class="p-3 border font-mono">${user.email}</td>
                            <td class="p-3 border font-mono">${user.address.city}</td>
                            <td class="p-3 border font-mono">${user.company.name}</td>
                        </tr>
                    `;
                });

                // TUGAS 2: Masukkan 'barisHTML' ke dalam 'tbody.innerHTML'
                tbody.innerHTML = barisHTML;

            } catch (error) {
                // Blok ini otomatis jalan jika internet mati atau URL API salah
                errorBox.innerText = "Terjadi kesalahan: " + error.message;
                errorBox.classList.remove('hidden');
            } finally {
                // TUGAS 3: Sembunyikan kembali indikator 'loading' dengan menambahkan class 'hidden'
                // Petunjuk: loading.classList.add('hidden');
                loading.classList.add('hidden');
            }
        }

        // Jalankan fungsi otomatis saat halaman dibuka
        ambilDataDariServer();
    </script>

</body>

</html>
