<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Karyawan Interaktif - Minggu 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-8 font-sans text-slate-800">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- KOLOM KIRI: Form Tambah Karyawan -->
        <div class="bg-white p-6 rounded-xl shadow-md h-fit">
            <h2 class="text-xl font-bold mb-4">Tambah Karyawan</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">NIP</label>
                    <input type="text" id="inputNip" placeholder="EMP006" class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
                    <input type="text" id="inputNama" placeholder="Nama karyawan..."
                        class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Divisi</label>
                    <select id="inputDivisi" class="w-full border rounded-lg p-2">
                        <option value="IT Development">IT Development</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Gaji Pokok (Rp)</label>
                    <input type="number" id="inputGaji" placeholder="6000000" class="w-full border rounded-lg p-2">
                </div>
                <button onclick="tambahKaryawan()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">
                    + Simpan ke Tabel
                </button>
            </div>
        </div>

        <!-- KOLOM KANAN (2 Kolom): Filter & Tabel Data -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-xl font-bold">Daftar Karyawan</h2>
                <div class="flex gap-2">
                    <!-- Input Live Search (oninput otomatis jalan setiap jari mengetik 1 huruf) -->
                    <input type="text" id="inputCari" oninput="renderTabel()" placeholder="Cari nama / NIP..."
                        class="border rounded-lg p-2 text-sm">

                    <!-- Filter Divisi -->
                    <select id="filterDivisi" onchange="renderTabel()"
                        class="border rounded-lg p-2 text-sm bg-slate-50">
                        <option value="SEMUA">Semua Divisi</option>
                        <option value="IT Development">IT Development</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>
            </div>

            <table class="w-full border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-200 text-left uppercase text-slate-700">
                        <th class="p-3 border">NIP</th>
                        <th class="p-3 border">Nama</th>
                        <th class="p-3 border">Divisi</th>
                        <th class="p-3 border">Gaji</th>
                        <th class="p-3 border text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody"></tbody>
            </table>

            <div class="mt-4 text-right font-bold text-slate-700">
                Total Pengeluaran Gaji (Terfilter): <span id="totalPayroll" class="text-blue-700">Rp 0</span>
            </div>
        </div>

    </div>

    <script>
        const dataKaryawan = [
            { nip: "EMP001", nama: "Ahmad", divisi: "IT Development", gaji: 9500000 },
            { nip: "EMP002", nama: "Amad", divisi: "Human Resources", gaji: 5500000 },
            { nip: "EMP003", nama: "Ahad", divisi: "Finance", gaji: 7200000 },
            { nip: "EMP004", nama: "Ahmed", divisi: "Human Resources", gaji: 11500000 },
            { nip: "EMP005", nama: "Ahud", divisi: "IT Development", gaji: 4500000 }
        ];

        function renderTabel() {
            const divisiPilihan = document.getElementById('filterDivisi').value;
            // Mengambil teks pencarian dan mengubahnya jadi huruf kecil semua
            const kataKunci = document.getElementById('inputCari').value.toLowerCase();
            const tbody = document.getElementById('tabelBody');

            // 1. Menyaring data berdasarkan Divisi DAN Kata Kunci Pencarian
            const dataTampil = dataKaryawan.filter((item) => {
                const cocokDivisi = (divisiPilihan === "SEMUA") || (item.divisi === divisiPilihan);

                // TUGAS 1: Buat variabel 'cocokKataKunci' yang mengecek apakah item.nama.toLowerCase() 
                // ATAU item.nip.toLowerCase() mengandung (.includes) 'kataKunci'
                // Petunjuk: const cocokKataKunci = item.nama.toLowerCase().includes(kataKunci) || item.nip.toLowerCase().includes(kataKunci);
                const cocokKataKunci = item.nama.toLowerCase().includes(kataKunci) || item.nip.toLowerCase().includes(kataKunci);

                // Hanya tampilkan jika cocokDivisi DAN (&&) cocokKataKunci bernilai true
                return cocokDivisi && cocokKataKunci;
            });

            let barisHTML = "";
            let totalGaji = 0;

            dataTampil.forEach((item) => {
                totalGaji += item.gaji;
                barisHTML += `
            <tr class="hover:bg-slate-50">
                <td class="p-3 border font-mono">${item.nip}</td>
                <td class="p-3 border font-medium">${item.nama}</td>
                <td class="p-3 border">${item.divisi}</td>
                <td class="p-3 border">Rp ${item.gaji.toLocaleString('id-ID')}</td>
                <td class="p-3 border text-center">
                    <button onclick="hapusKaryawan('${item.nip}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded text-xs font-semibold">
                        Hapus
                    </button>
                </td>
            </tr>
        `;
            });

            tbody.innerHTML = barisHTML;
            document.getElementById('totalPayroll').innerText = "Rp " + totalGaji.toLocaleString('id-ID');
        }

        // Fungsi untuk menghapus karyawan berdasarkan NIP
        function hapusKaryawan(nipTarget) {
            const yakin = confirm("Apakah Anda yakin ingin menghapus karyawan dengan NIP " + nipTarget + "?");
            if (!yakin) {
                return; // Batal hapus jika user klik Cancel
            }

            // Mencari posisi urutan (index) karyawan di dalam array dataKaryawan
            const index = dataKaryawan.findIndex((item) => item.nip === nipTarget);

            if (index !== -1) {
                // TUGAS 2: Hapus 1 data pada posisi 'index' menggunakan dataKaryawan.splice(index, 1);
                dataKaryawan.splice(index, 1);
                // TUGAS 3: Panggil kembali fungsi renderTabel() agar tampilan tabel ter-update!
                renderTabel();
            }
        }

        // Fungsi saat tombol "+ Simpan ke Tabel" diklik
        function tambahKaryawan() {
            const nip = document.getElementById('inputNip').value;
            const nama = document.getElementById('inputNama').value;
            const divisi = document.getElementById('inputDivisi').value;
            const gaji = Number(document.getElementById('inputGaji').value);

            // TUGAS 1: Buat validasi if — jika nip kosong ATAU nama kosong ATAU gaji <= 0,
            // munculkan alert("Semua data wajib diisi dengan benar!") lalu hentikan dengan return;
            if (nip === "" || nama === "" || gaji <= 0) {
                alert("Semua data wajib diisi dengan benar!");
                return;
            }

            // TUGAS 2: Masukkan data baru ke dalam array 'dataKaryawan' menggunakan .push()
            // Petunjuk: dataKaryawan.push({ nip: nip, nama: nama, divisi: divisi, gaji: gaji });
            dataKaryawan.push({ nip, nama, divisi, gaji });

            // Mengosongkan kembali kotak input setelah disimpan
            document.getElementById('inputNip').value = "";
            document.getElementById('inputNama').value = "";
            document.getElementById('inputGaji').value = "";

            // TUGAS 3: Panggil fungsi renderTabel() di bawah ini agar tabel otomatis diperbarui!
            renderTabel();
        }

        // Panggil renderTabel() pertama kali saat halaman dibuka
        renderTabel();
    </script>

</body>

</html>
